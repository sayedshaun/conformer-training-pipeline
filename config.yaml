data:
  output_dir: data
  workers: 8
  skip_download: false
  sources:
    - type: mcv
      name: mcv
      dataset_id: cmqim44fo00tinr07mbu70eg7
      splits: [train, dev, test]
    - type: openslr
      name: openslr
      shards: all   
      dev_utterances: 500
      test_utterances: 500
    - type: fleurs
      name: fleurs         
    - type: ben10
      name: ben10
    - type: openslr37
      name: openslr37
      locales: all
    - type: shrutilipi
      name: shrutilipi
    - type: kathbath
      name: kathbath
    - type: indicvoices
      name: indicvoices
    - type: vaani
      name: vaani
  split_ratio: {train: 98, dev: 0.67, test: 1.33}

tokenizer:
  manifests: [data/train_manifest.json, data/dev_manifest.json, data/test_manifest.json]
  tokenizer_dir: data/tokenizer_bn_bpe_v1024
  vocab_size: 1024
  model_type: bpe   # bpe | unigram

train:
  pretrained_model: ai4bharat/indicconformer_stt_bn_hybrid_ctc_rnnt_large
  model_type: hybrid   # hybrid | ctc | rnnt
  resume: true         # resume from the latest checkpoint in exp_dir/exp_name if one exists
  tokenizer_dir: null  # null keeps the checkpoint's own tokenizer
  train_manifest: data/train_manifest.json
  val_manifest: data/dev_manifest.json
  exp_name: indicconformer_bn_finetune
  exp_dir: experiments
  batch_size: 8
  val_batch_size: 4
  num_workers: 8
  lr: 3e-5
  max_epochs: 100
  devices: 1     # int count, -1 for all GPUs, or a list e.g. [0, 1]
  precision: 16-mixed
  val_check_interval: 1.0
  log_every_n_steps: 50
  accumulate_grad_batches: 4
  gradient_clip_val: 1.0
  freeze_encoder_steps: 500
  wandb_project: ASR
  wandb_entity: null
  wandb_run_name: asr-indicconformer-bn-finetune

eval:
  model_path: experiments/indicconformer_bn_finetune/final.nemo
  manifest: data/test_manifest.json
  batch_size: 16
  decoder: rnnt               # ctc | rnnt
  output_predictions: null
