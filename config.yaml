data:
  output_dir: data
  workers: 8
  skip_download: false
  sources:
    - type: mcv
      name: mcv
      dataset_id: cmqim44fo00tinr07mbu70eg7
      splits: [train, dev, test]
    - type: openslr
      name: openslr
      shards: all   
      dev_utterances: 500
      test_utterances: 500
    - type: fleurs
      name: fleurs         
  split_ratio: {train: 98, dev: 0.67, test: 1.33}

tokenizer:
  manifests: [data/train_manifest.json, data/dev_manifest.json, data/test_manifest.json]
  tokenizer_dir: data/tokenizer_bn_bpe_v1024
  vocab_size: 1024
  model_type: bpe   # bpe | unigram

train:
  pretrained_model: stt_en_fastconformer_hybrid_large_pc
  tokenizer_dir: data/tokenizer_bn_bpe_v1024
  train_manifest: data/train_manifest.json
  val_manifest: data/dev_manifest.json
  exp_name: fastconformer_finetune
  exp_dir: experiments
  batch_size: 2
  val_batch_size: 2
  num_workers: 8
  lr: 1e-5
  max_epochs: 100
  devices: 1
  precision: 16-mixed
  val_check_interval: 5000
  log_every_n_steps: 5000
  accumulate_grad_batches: 6
  gradient_clip_val: 1.0
  freeze_encoder_steps: 0
  wandb_project: ASR
  wandb_entity: null
  wandb_run_name: asr-fastconformer-finetune

eval:
  model_path: experiments/fastconformer_finetune/final.nemo
  manifest: data/test_manifest.json
  batch_size: 16
  decoder: rnnt               # ctc | rnnt
  output_predictions: null
